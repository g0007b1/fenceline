name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: self-check (dogfood)
        run: |
          node bin/agent-ready.js scan
          node bin/agent-ready.js init -y --runtime claude --no-siblings
          node bin/agent-ready.js doctor
          node bin/agent-ready.js uninstall --docs

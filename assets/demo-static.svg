<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
  <rect width="980" height="560" rx="14" fill="#0b0e14"/>
  <rect x="0" y="0" width="980" height="36" rx="14" fill="#161b26"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/><circle cx="42" cy="18" r="6" fill="#ffbd2e"/><circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="490" y="23" text-anchor="middle" fill="#64748b" font-size="13">demo-app — agent-ready</text>

  <g fill="#cbd5e1">
    <text x="24" y="70" fill="#94a3b8">$ npx agent-ready init</text>
    <text x="24" y="98" fill="#e2e8f0">init: Next.js, TypeScript, Prisma, Vitest, npm → preset "react-web" · runtimes: Cursor, Claude Code</text>
    <text x="24" y="130"><tspan fill="#4ade80">  installed  </tspan>.agent-ready/hooks/*</text>
    <text x="24" y="154"><tspan fill="#4ade80">  created    </tspan>.cursor/hooks.json  ·  .claude/settings.json</text>
    <text x="24" y="178"><tspan fill="#4ade80">  created    </tspan>.cursor/rules/agent-ready-react-components.mdc  (+ agent-workflow, docs-sync, testing)</text>
    <text x="24" y="202"><tspan fill="#4ade80">  created    </tspan>.cursor/commands/agent-ready-review.md  (+ pr, handoff, domain-doc, triage)</text>
    <text x="24" y="226"><tspan fill="#4ade80">  created    </tspan>AGENTS.md  ·  CLAUDE.md  ·  docs/agent-safe-tasks.md  ·  docs/README.md</text>
    <text x="24" y="250"><tspan fill="#4ade80">  created    </tspan>docs/features-bookings.md   <tspan fill="#64748b">← 13 commits, 12 bug fixes: this zone gets a domain doc</tspan></text>
    <text x="24" y="284" fill="#a5f3fc">Enforced: lint + type-check on stop · 13 protected paths · parsed git/rm/redirects + 14 shell rules</text>

    <text x="24" y="330" fill="#94a3b8">$ npx agent-ready triage "Add a refund flow with Stripe and a new payments table"</text>
    <text x="24" y="358">agent-ready triage → <tspan fill="#f87171" font-weight="700">HUMAN</tspan> — outside the safe-list</text>
    <text x="24" y="382">  - touches risk zone "payments" (payment, refund)</text>
    <text x="24" y="406">  - touches risk zone "migrations" (new table)</text>
    <text x="24" y="430">  - introduces a new layer (new) in a risk zone</text>

    <text x="24" y="474" fill="#94a3b8">$ npx agent-ready triage "Remove the header on the bookings screen. Given the page loads, then no header."</text>
    <text x="24" y="502">agent-ready triage → <tspan fill="#4ade80" font-weight="700">AUTO</tspan> — safe for an automatic PR</text>
    <text x="24" y="526">  - small-scope keywords: header  ·  has acceptance criteria  ·  read first: docs/features-bookings.md</text>
  </g>
</svg>
